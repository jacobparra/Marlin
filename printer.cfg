[include mainsail.cfg]

# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v2.0. To use this config, the firmware should be compiled for the
# STM32F103 with a "28KiB bootloader" and USB communication. Also,
# select "Enable extra low-level configuration options" and configure
# "GPIO pins to set at micro-controller startup" to "!PA14".

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_35FFD5054246303326720257-if00

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 275
# Recomendado para sensorless: rotation_distance / 2 = 40 / 2 = 20 mm/s
# (según TMC_Drivers.md: motor completa 1 rotación cada 2 segundos)
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 238
# Recomendado para sensorless: rotation_distance / 2 = 40 / 2 = 20 mm/s
# (según TMC_Drivers.md: motor completa 1 rotación cada 2 segundos)
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: 0.0
position_max: 250
homing_speed: 5
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 22.94
nozzle_diameter: 0.400
filament_diameter: 1.750
# The remaining variables describe the extruder heater.
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control = pid
pid_kp = 28.177
pid_ki = 1.998
pid_kd = 99.325
min_temp: 0
max_temp: 250

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3
control: pid
pid_Kp=71.313
pid_Ki=0.997
pid_Kd=1275.614
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7
heater: extruder
heater_temp: 40.0
fan_speed: 1.0

[fan]
pin: PC6

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -41.0
y_offset: -10.0
z_offset: 0.415
speed: 5.0
samples: 2
sample_retract_dist: 5.0

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 3000
max_z_velocity: 20
max_z_accel: 100

[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>


######################################################################
# 128x64 Full Graphic Creality CR10 / ENDER 3 stockdisplay
######################################################################

# This section is used for a Creality "12864" display with a single
# ribbon cable between the display's EXP3 plug and the
# micro-controller board's EXP1 connector.

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

[filament_switch_sensor filament_sensor]
switch_pin: ^PC15
# Pausa automáticamente cuando se acaba el filamento
pause_on_runout: True

[safe_z_home]
home_xy_position: 156, 116
z_hop: 10
z_hop_speed: 10

[bed_mesh]
speed: 50
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 220, 220
probe_count: 10, 10
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1
fade_end: 10
adaptive_margin: 10

[screws_tilt_adjust]
# Comando: SCREWS_TILT_CALCULATE
screw1: 72, 42
screw1_name: front left screw
screw2: 241, 42
screw2_name: front right screw
screw3: 241, 213
screw3_name: rear right screw
screw4: 72, 213
screw4_name: rear left screw
horizontal_move_z: 5.0
speed: 50
screw_thread: CW-M4

[temperature_sensor SKR_Mini_E3]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[force_move]
enable_force_move: True
#   Set to true to enable FORCE_MOVE and SET_KINEMATIC_POSITION
#   extended G-Code commands. The default is false.

[idle_timeout]
#gcode:
#   A list of G-Code commands to execute on an idle timeout. See
#   docs/Command_Templates.md for G-Code format. The default is to run
#   "TURN_OFF_HEATERS" and "M84".
timeout: 600
#   Idle time (in seconds) to wait before running the above G-Code
#   commands. The default is 600 seconds.


######################################################################
# Start Print and End Print
######################################################################

# Replace the slicer's custom start and end g-code scripts with
# START_PRINT and END_PRINT. See docs/Slicers.md for more information on using these macros.

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    # Check filament is loaded before starting
    {% if printer['filament_switch_sensor filament_sensor'].filament_detected == False %}
        M117 ERROR: No filament detected!
        CANCEL_PRINT
    {% endif %}
    # Use absolute coordinates
    G90
    # Extruder in relative mode
    M83
    # Start bed heating and preheat nozzle (parallel)
    M140 S{BED_TEMP}
    M104 S150
    # Home the printer
    G28
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    G28 Z
    # Bed mesh calibration with correct bed temperature (adaptive mode)
    BED_MESH_PROFILE LOAD=TEMP_55
    # BED_MESH_CALIBRATE ADAPTIVE=1
    # Move nozzle away from bed while waiting for final temperature
    G1 X275 Y0 F6000
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}
    # Reset the G-Code Z offset
    SET_GCODE_OFFSET Z=0.0
    # Nozzle purge/prime pattern (front right area)
    G1 X230 Y10 F3000
    G1 Z0.28 F240
    G92 E0
    G1 Y75 E5 F1500  ; Prime line 1
    G1 X230.3 F5000
    G92 E0
    G1 Y10 E5 F1200  ; Prime line 2
    G92 E0
    G1 E-0.5 F1000   ; Small retract to avoid stringing
    # Ready to print
    G1 Z5 F3000

[gcode_macro END_PRINT]
gcode:
    # Retract filament
    G92 E0
    G1 E-2 F1000
    # Raise nozzle and present print
    G91  ; Relative positioning
    G1 Z10 F600
    G90  ; Absolute positioning
    G1 X275 Y0 F6000  ; Present print
    # Turn off hotend immediately
    M104 S0
    # Gradual bed cooling (reduce warping)
    M140 S50  ; Bed to 50°C
    M107      ; Fan off
    # Wait 30 seconds for bed to cool
    G4 P30000
    # Turn off bed completely
    M140 S0
    # Cool hotend to safe temperature before shutdown
    M109 R50
    # Disable all steppers
    M84


# Client variable macro for your printer.cfg
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 275.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 0.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_retract          : 1.0   ; the value to retract while PAUSE
variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0  ; retract speed in mm/s
variable_unretract        : 1.0   ; the value to unretract while RESUME
variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_speed_hop        : 15.0  ; z move speed in mm/s
variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : True ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
# variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
# variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
# !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
# variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
# variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : "filament_switch_sensor filament_sensor"    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
#                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
# !!! Custom macros, please use with care and review the section of the corresponding macro.
# These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
# Only  single line commands are supported, please create a macro if you need more than one command.
# variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
# variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
# variable_user_cancel_macro: ""    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
